# The GPU tests are *not* run automatically for every push or pull request, since they are
# not essential for the vast majority of pull requests and the GPU machines are a scarce
# resource. Therefore, it can take quite a while for them to start. They only run if
#   * the pull request carries the label `run gpu tests`, which is added by a developer to
#     request them,
#   * the build is for the default branch (`main`), i.e., after a pull request was merged,
#     or
#   * the build was started manually from the Buildkite web interface.
#
# Adding the label starts a build; this requires the setting
# `Rebuild pull requests when labels are changed` in the Buildkite pipeline. To test a new
# commit after pushing to a labeled pull request, remove the label and add it again (or
# start a new build from the Buildkite web interface).

env:

steps:
  - label: "CUDA Julia {{matrix.version}}"
    matrix:
      setup:
        version:
          - "1.10" # LTS
          - "1.13"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      - JuliaCI/julia-test#v1: ~
    env:
      TRIXI_TEST: "CUDA"
      TRIXI_TEST_VERBOSE: "true"
    agents:
      queue: "cuda"
    if: >
      build.message !~ /\[skip ci\]/ &&
      (build.branch == pipeline.default_branch ||
      build.source == "ui" ||
      build.pull_request.labels includes "run gpu tests")
    timeout_in_minutes: 60
    soft_fail:
      - exit_status: 3
  - label: "AMDGPU Julia {{matrix.version}}"
    matrix:
      setup:
        version:
          - "1.10" # LTS
          - "1.13"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      - JuliaCI/julia-test#v1: ~
    env:
      TRIXI_TEST: "AMDGPU"
      TRIXI_TEST_VERBOSE: "true"
    agents:
      queue: "rocm"
    if: >
      build.message !~ /\[skip ci\]/ &&
      (build.branch == pipeline.default_branch ||
      build.source == "ui" ||
      build.pull_request.labels includes "run gpu tests")
    timeout_in_minutes: 60
    soft_fail:
      - exit_status: 3
  - label: "Metal Julia {{matrix.version}}"
    matrix:
      setup:
        version:
          - "1.10" # LTS
          - "1.13"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      - JuliaCI/julia-test#v1: ~
    env:
      TRIXI_TEST: "Metal"
      TRIXI_TEST_VERBOSE: "true"
    agents:
      queue: "metal"
    if: >
      build.message !~ /\[skip ci\]/ &&
      (build.branch == pipeline.default_branch ||
      build.source == "ui" ||
      build.pull_request.labels includes "run gpu tests")
    timeout_in_minutes: 30
    soft_fail:
      - exit_status: 3
