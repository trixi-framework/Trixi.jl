env:

# The GPU tests run once with the oldest compatible versions of all packages on the oldest
# Julia version supported by Trixi.jl and once with the newest compatible versions on a
# newer Julia version. The script `test/run_ci_tests.jl` chooses the versions based on the
# Julia version and adds the respective GPU package to the test environment.
steps:
  - label: "CUDA Julia {{matrix.version}}"
    matrix:
      setup:
        version:
          - "1.10" # LTS, oldest compatible package versions
          - "1.13" # newest compatible package versions
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
    command: julia --color=yes test/run_ci_tests.jl CUDA
    env:
      TRIXI_TEST: "CUDA"
      TRIXI_TEST_VERBOSE: "true"
    agents:
      queue: "cuda"
    if: build.message !~ /\[skip ci\]/
    timeout_in_minutes: 60
    soft_fail:
      - exit_status: 3
  - label: "AMDGPU Julia {{matrix.version}}"
    matrix:
      setup:
        version:
          - "1.10" # LTS, oldest compatible package versions
          - "1.13" # newest compatible package versions
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
    command: julia --color=yes test/run_ci_tests.jl AMDGPU
    env:
      TRIXI_TEST: "AMDGPU"
      TRIXI_TEST_VERBOSE: "true"
    agents:
      queue: "rocm"
    if: build.message !~ /\[skip ci\]/
    timeout_in_minutes: 60
    soft_fail:
      - exit_status: 3
  - label: "Metal Julia {{matrix.version}}"
    matrix:
      setup:
        version:
          - "1.10" # LTS, oldest compatible package versions
          - "1.13" # newest compatible package versions
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
    command: julia --color=yes test/run_ci_tests.jl Metal
    env:
      TRIXI_TEST: "Metal"
      TRIXI_TEST_VERBOSE: "true"
    agents:
      queue: "metal"
    if: build.message !~ /\[skip ci\]/
    timeout_in_minutes: 30
    soft_fail:
      - exit_status: 3
