workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $EXPECTED_COMMIT_SHA == $CI_COMMIT_SHA'

stages: [prepare, check, benchmark, scaling]

variables:
  GIT_DEPTH: "1"
  # Selected checks, benchmarks and Julia versions, all, none or single values joined by +, GitHub triggers override them.
  HPC_CHECKS: all
  HPC_BENCHMARKS: none
  HPC_JULIA: all

default:
  tags: [otus-slurm]
  id_tokens:
    CI_JOB_JWT:
      aud: https://git.uni-paderborn.de
  # Jobs receive the artifacts of the jobs they need, so each job uploads only its own results.
  artifacts:
    when: always
    paths: [results/$CHECK/$JULIA_VERSION/]
    expire_in: 4 weeks
  before_script:
    - set -euo pipefail
    - source hpc/env.sh "$JULIA_VERSION"
    - export RESULTS="$CI_PROJECT_DIR/results/$CHECK/$JULIA_VERSION"
    - mkdir -p "$RESULTS"
    - |
      if [[ $CHECK == prepare ]]; then
        export JULIA_PKG_OFFLINE=false
      else
        export JULIA_PKG_OFFLINE=true
        sacct -X -j "$SLURM_JOB_ID" --format=JobID,Submit,Start,State --noheader
      fi
      project="$CI_PROJECT_DIR/run_hpc/$JULIA_VERSION/test"
      julia_args=(--startup-file=no -C "$JULIA_CPU_TARGET" --check-bounds=yes "--project=$project")
      bench_args=("${julia_args[@]/--check-bounds=yes/--check-bounds=auto}")

.prepare:
  stage: prepare
  tags: [otus-shell]
  timeout: 4 hours
  resource_group: prepare-$JULIA_VERSION
  variables:
    CHECK: prepare
    JULIA_NUM_THREADS: "8"
  script:
    - |
      # Slurm jobs are submitted before they can source env.sh, so these come from GitLab project variables.
      for name in HPC_ACCOUNT CPU_PARTITION GPU_PARTITION; do
        [[ -n ${!name:-} ]] || { echo "Set the GitLab project variable $name for the Slurm requests." >&2; exit 1; }
      done
      mkdir -p "$CI_DEPOT_ROOT/$JULIA_VERSION"
      exec 8>"$CI_DEPOT_ROOT/$JULIA_VERSION/prepare.lock"
      flock 8
      bash hpc/install_libraries.sh 2>&1 | tee "$RESULTS/native.log"
      julia --startup-file=no -C "$JULIA_CPU_TARGET" --check-bounds=yes --project=hpc hpc/ci/environment.jl prepare 2>&1 | tee "$RESULTS/resolve.log"
      for backend in polyester kernelabstractions; do
        julia "${julia_args[@]}" hpc/ci/environment.jl backend "$backend"
        julia "${julia_args[@]}" hpc/ci/environment.jl precompile 2>&1 | tee "$RESULTS/precompile-$backend.log"
      done
      julia "${julia_args[@]}" hpc/ci/environment.jl backend polyester
      if [[ $HPC_BENCHMARKS != none ]]; then
        julia "${bench_args[@]}" hpc/ci/environment.jl precompile 2>&1 | tee "$RESULTS/precompile-benchmark.log"
      fi
      julia "${julia_args[@]}" --threads=1 hpc/check_environment.jl "$JULIA_VERSION" 2>&1 | tee "$RESULTS/check.log"
      julia "${julia_args[@]}" hpc/ci/environment.jl freeze
  artifacts:
    when: always
    paths:
      - results/$CHECK/$JULIA_VERSION/
      - run_hpc/$JULIA_VERSION/test/
      - run_hpc/$JULIA_VERSION/provenance.toml
    expire_in: 4 weeks

.compute:
  stage: check
  timeout: 7 days
  variables:
    JACAMAR_SCHEDULER_JOB_PREFIX: "trixi-${CI_JOB_NAME_SLUG}"

.cpu:
  extends: .compute
  variables:
    CHECK: cpu
    SCHEDULER_PARAMETERS: "-A $HPC_ACCOUNT -q express -p $CPU_PARTITION -N 1 -n 1 -c 4 --mem=32G -t 00:30:00"
  script:
    - |
      julia "${julia_args[@]}" hpc/ci/environment.jl verify
      julia "${julia_args[@]}" --threads=1 hpc/check_environment.jl "$JULIA_VERSION" 2>&1 | tee "$RESULTS/serial.log"
      julia "${julia_args[@]}" --threads=4 hpc/ci/validate.jl polyester 2>&1 | tee "$RESULTS/threaded.log"
      julia "${julia_args[@]}" --threads=1 hpc/ci/environment.jl backend kernelabstractions
      julia "${julia_args[@]}" --threads=3 hpc/ci/validate.jl kernelabstractions 2>&1 | tee "$RESULTS/kernelabstractions.log"
      julia "${julia_args[@]}" --threads=1 hpc/ci/environment.jl backend polyester

.mpi:
  extends: .compute
  variables:
    CHECK: mpi
    UCX_LOG_LEVEL: info
    SCHEDULER_PARAMETERS: "-A $HPC_ACCOUNT -q express -p $CPU_PARTITION -N 2 -n 2 --ntasks-per-node=1 -c 1 --mem=32G -t 00:30:00"
  script:
    - |
      julia "${julia_args[@]}" hpc/ci/environment.jl verify
      julia "${julia_args[@]}" --threads=1 hpc/ci/mpi.jl mpi 2>&1 | tee "$RESULTS/mpi.log"

.gpu:
  extends: .compute
  variables:
    CHECK: gpu
    OMPI_MCA_opal_cuda_support: "1"
    SCHEDULER_PARAMETERS: "-A $HPC_ACCOUNT -q express -p $GPU_PARTITION --gres=gpu:h100:2 -N 1 -n 2 -c 4 --mem=64G -t 00:20:00"
  script:
    - |
      julia "${julia_args[@]}" hpc/ci/environment.jl verify
      julia "${julia_args[@]}" --threads=4 hpc/ci/validate.jl cuda 2>&1 | tee "$RESULTS/cuda.log"
      julia "${julia_args[@]}" --threads=1 hpc/ci/mpi.jl cuda_mpi 2>&1 | tee "$RESULTS/cuda-mpi.log"

# Each scaling point runs as its own matrix job, the job names end with the count of threads, ranks or GPUs.
# CPU points reserve whole nodes, so no other job shares the memory bandwidth, and fill the cores of the first socket in order.
.bench:
  extends: .compute
  stage: benchmark
  variables:
    CPU_ELIXIR: examples/p4est_3d_dgsem/elixir_euler_source_terms.jl
    # The steps grow with the count, so every point measures about ten seconds under ideal scaling.
    CPU_OPTIONS: '(; initial_refinement_level = 3, maxiters = 16 * parse(Int, ENV["COUNT"]), analysis_callback = TrivialCallback(), save_solution = TrivialCallback())'
    GPU_ELIXIR: benchmark/CUDA/elixir_euler_taylor_green_vortex.jl
    GPU_OPTIONS: "using CUDA; CUDA.device!(Trixi.mpi_rank()); (; initial_refinement_level = 3, maxiters = 500, storage_type = CuArray, real_type = Float64, analysis_callback = TrivialCallback())"

.bench-threads:
  extends: .bench
  variables:
    CHECK: bench-threads
    SCHEDULER_PARAMETERS: "-A $HPC_ACCOUNT -q express -p $CPU_PARTITION -N 1 -n 1 -c 192 --exclusive --mem=0 -t 00:30:00"
  parallel:
    matrix:
      - COUNT: ["1", "8", "24", "48", "96"]
  script:
    - julia "${julia_args[@]}" hpc/ci/environment.jl verify
    - lscpu | grep -E '^(Model name|Socket|Core|NUMA)'
    - julia "${bench_args[@]}" --threads=$COUNT benchmark/run.jl "$CPU_ELIXIR" "using ThreadPinning; pinthreads(:cores); threadinfo(); $CPU_OPTIONS" "$RESULTS/pid-$COUNT.txt" 2>&1 | tee "$RESULTS/pid-$COUNT.log"

.bench-mpi:
  extends: .bench
  variables:
    CHECK: bench-mpi
    SCHEDULER_PARAMETERS: "-A $HPC_ACCOUNT -q express -p $CPU_PARTITION -N $NODES --ntasks-per-node=96 -c 1 --exclusive --mem=0 -t 00:30:00"
  parallel:
    matrix:
      - COUNT: ["1", "24", "96"]
        NODES: "1"
      - COUNT: "192"
        NODES: "2"
  script:
    - julia "${julia_args[@]}" hpc/ci/environment.jl verify
    - lscpu | grep -E '^(Model name|Socket|Core|NUMA)'
    - mpiexec --map-by core --bind-to core --report-bindings -n $COUNT julia "${bench_args[@]}" --threads=1 benchmark/run.jl "$CPU_ELIXIR" "$CPU_OPTIONS" "$RESULTS/pid-$COUNT.txt" 2>&1 | tee "$RESULTS/pid-$COUNT.log"

.bench-gpu:
  extends: .bench
  variables:
    CHECK: bench-gpu
    OMPI_MCA_opal_cuda_support: "1"
    SCHEDULER_PARAMETERS: "-A $HPC_ACCOUNT -q express -p $GPU_PARTITION --gres=gpu:h100:2 -N 1 -n 2 -c 24 --mem=180G -t 00:30:00"
  parallel:
    matrix:
      - COUNT: ["1", "2"]
  script:
    - julia "${julia_args[@]}" hpc/ci/environment.jl verify
    - mpiexec --map-by slot:PE=24 --bind-to core -n $COUNT julia "${bench_args[@]}" --threads=1 benchmark/run.jl "$GPU_ELIXIR" "$GPU_OPTIONS" "$RESULTS/pid-$COUNT.txt" 2>&1 | tee "$RESULTS/pid-$COUNT.log"

# Combines the points of one series into the benchmark files read by the GitHub benchmark suites.
.scaling:
  stage: scaling
  tags: [otus-shell]
  before_script:
    - set -euo pipefail
    - source hpc/env.sh "$JULIA_VERSION"
    - export RESULTS="$CI_PROJECT_DIR/results/$CHECK/$JULIA_VERSION"
  script:
    - julia --startup-file=no hpc/ci/scaling.jl "$SERIES"

