name: HPC command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  hpc:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/hpc')
    uses: pc2/hpc-cb-workflow/.github/workflows/hpc-command.yml@1eaa31d7e9035ea9c662af1bfd18d90a6654804d
    with:
      workflow: hpc.yml
