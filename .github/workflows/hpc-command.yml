name: HPC command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  hpc:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/hpc')
    uses: pc2/hpc-cb-workflow/.github/workflows/hpc-command.yml@58f6bf270de20d78d395877306e627c25f0c53d5
    with:
      workflow: hpc.yml
