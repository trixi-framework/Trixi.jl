# Note: this file is inspired by the downstream testing facilities in the SciML ecosystem
# x-ref: https://github.com/SciML/SciMLBase.jl/blob/ffe68aebedee5915190623cb08160d7ef1fbcce0/.github/workflows/Downstream.yml

name: Downstream
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'AUTHORS.md'
      - 'CITATION.bib'
      - 'CONTRIBUTING.md'
      - 'LICENSE.md'
      - 'NEWS.md'
      - 'README.md'
      - '.zenodo.json'
      - '.github/workflows/benchmark.yml'
      - '.github/workflows/CompatHelper.yml'
      - '.github/workflows/TagBot.yml'
      - 'benchmark/**'
      # - 'docs/**'
      - 'utils/**'
  pull_request:
    paths-ignore:
      - 'AUTHORS.md'
      - 'CITATION.bib'
      - 'CONTRIBUTING.md'
      - 'LICENSE.md'
      - 'NEWS.md'
      - 'README.md'
      - '.zenodo.json'
      - '.github/workflows/benchmark.yml'
      - '.github/workflows/CompatHelper.yml'
      - '.github/workflows/TagBot.yml'
      - 'benchmark/**'
      # - 'docs/**'
      - 'utils/**'
  workflow_dispatch:

# Cancel redundant CI tests automatically
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    # We could also include the Julia version as in
    # name: ${{ matrix.trixi_test }} - ${{ matrix.os }} - Julia ${{ matrix.version }} - ${{ matrix.arch }}
    # to be more specific. However, that requires us updating the required CI tests whenever we update Julia.
    name: ${{ matrix.package }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    env:
      # Parts of the Julia depot to cache, excluding lock files. Restoring and saving
      # must use the same list since it is part of the cache version.
      JULIA_DEPOT_CACHE_PATHS: |
        ~/.julia/artifacts
        ~/.julia/packages
        ~/.julia/registries
        ~/.julia/compiled
        ~/.julia/scratchspaces
        ~/.julia/logs
        !~/.julia/artifacts/*.pid
        !~/.julia/artifacts/*.pidfile
        !~/.julia/compiled/v*.*/*.pid
        !~/.julia/compiled/v*.*/*.pidfile
        !~/.julia/compiled/v*.*/*/*.pid
        !~/.julia/compiled/v*.*/*/*.pidfile
        !~/.julia/packages/*/*.pid
        !~/.julia/packages/*/*.pidfile
        !~/.julia/registries/*/.pid
        !~/.julia/registries/*/.pidfile
        !~/.julia/logs/*.pid
        !~/.julia/logs/*.pidfile
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
        os:
          - ubuntu-latest
        arch:
          - x64
        package:
          - Trixi2Vtk.jl
          - TrixiShallowWater.jl
          - TrixiAtmo.jl
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - run: julia -e 'using InteractiveUtils; versioninfo(verbose=true)'
      # Caches of the Julia depot are saved only from runs on `main` (see the save step
      # below). Pull requests restore them but do not save their own, since entries saved
      # from pull requests fill the repository cache storage and get the entries of `main`
      # evicted. The workflow `CacheCleanup.yml` deletes all but the newest entry per key
      # prefix.
      - name: Restore Julia depot cache
        id: julia-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.JULIA_DEPOT_CACHE_PATHS }}
          key: julia-depot;workflow=Downstream;os=${{ runner.os }};arch=${{ runner.arch }};julia=${{ matrix.version }};package=${{ matrix.package }};run_id=${{ github.run_id }};run_attempt=${{ github.run_attempt }}
          restore-keys: |
            julia-depot;workflow=Downstream;os=${{ runner.os }};arch=${{ runner.arch }};julia=${{ matrix.version }};package=${{ matrix.package }};
      - name: Update cached registries
        if: steps.julia-cache.outputs.cache-matched-key != ''
        run: julia --color=yes -e 'import Pkg; Pkg.Registry.update()'
      - uses: julia-actions/julia-buildpkg@v1
      - name: Retrieve downstream package
        # Note: we retrieve the current `main` branch of the downstream package to ensure
        # that compatibility errors we make in Trixi.jl are detected already here
        # See also https://github.com/trixi-framework/Trixi.jl/pull/1707#discussion_r1382938895
        uses: actions/checkout@v7
        with:
          repository: trixi-framework/${{ matrix.package }}
          path: downstream
      - name: Load upstream package into downstream environment
        shell: julia --color=yes --project=downstream {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path="."))
          Pkg.update()
      - name: Run downstream tests (without coverage)
        shell: julia --color=yes --project=downstream {0}
        run: |
          using Pkg
          Pkg.test(coverage=false)
        env:
          TRIXI_TEST: upstream
          # Print every `@testitem` (with its run time) in the test summary of downstream
          # packages using TestItemRunner.jl, so per-testitem timings show up in the job logs.
          TRIXI_TEST_VERBOSE: "true"
      - name: Save Julia depot cache
        if: ${{ !cancelled() && steps.julia-cache.outcome == 'success' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.JULIA_DEPOT_CACHE_PATHS }}
          key: ${{ steps.julia-cache.outputs.cache-primary-key }}
