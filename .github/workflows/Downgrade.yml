name: Downgrade

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'AUTHORS.md'
      - 'CITATION.bib'
      - 'CONTRIBUTING.md'
      - 'LICENSE.md'
      - 'NEWS.md'
      - 'README.md'
      - '.zenodo.json'
      - '.github/workflows/benchmark.yml'
      - '.github/workflows/CompatHelper.yml'
      - '.github/workflows/TagBot.yml'
      - 'benchmark/**'
      - 'docs/**'
      - 'utils/**'
  workflow_dispatch:

# Cancel redundant CI tests automatically
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  downgrade_test:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    # We could also include the Julia version as in
    # name: ${{ matrix.trixi_test }} - ${{ matrix.os }} - Julia ${{ matrix.version }} - ${{ matrix.arch }}
    # to be more specific. However, that requires us updating the required CI tests whenever we update Julia.
    name: Downgrade ${{ matrix.trixi_test }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    env:
      # Parts of the Julia depot to cache, excluding lock files. Restoring and saving
      # must use the same list since it is part of the cache version.
      JULIA_DEPOT_CACHE_PATHS: |
        ~/.julia/artifacts
        ~/.julia/packages
        ~/.julia/registries
        ~/.julia/compiled
        ~/.julia/scratchspaces
        ~/.julia/logs
        !~/.julia/artifacts/*.pid
        !~/.julia/artifacts/*.pidfile
        !~/.julia/compiled/v*.*/*.pid
        !~/.julia/compiled/v*.*/*.pidfile
        !~/.julia/compiled/v*.*/*/*.pid
        !~/.julia/compiled/v*.*/*/*.pidfile
        !~/.julia/packages/*/*.pid
        !~/.julia/packages/*/*.pidfile
        !~/.julia/registries/*/.pid
        !~/.julia/registries/*/.pidfile
        !~/.julia/logs/*.pid
        !~/.julia/logs/*.pidfile
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          # - '~1.10.0-0' # including development versions
          # - 'nightly'
        os:
          - ubuntu-latest
        arch:
          - x64
        trixi_test:
          # - tree_part1
          # - tree_part2
          # - tree_part3
          # - tree_part4
          # - tree_part5
          # - structured
          # - p4est_part1
          # - p4est_part2
          # - t8code_part1
          # - unstructured_dgmulti
          # - parabolic_part1
          # - parabolic_part2
          # - parabolic_part3
          # - paper_self_gravitating_gas_dynamics
          # - misc_part1
          # - misc_part2
          # - performance_specializations_part1
          # - performance_specializations_part2
          # - mpi
          # - threaded
          - downgrade
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - run: julia -e 'using InteractiveUtils; versioninfo(verbose=true)'
      # Caches of the Julia depot are saved only from runs on `main` (see the save step
      # below). Pull requests restore them but do not save their own, since entries saved
      # from pull requests fill the repository cache storage and get the entries of `main`
      # evicted. The workflow `CacheCleanup.yml` deletes all but the newest entry per key
      # prefix.
      - name: Restore Julia depot cache
        id: julia-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.JULIA_DEPOT_CACHE_PATHS }}
          key: julia-depot;workflow=Downgrade;os=${{ runner.os }};arch=${{ runner.arch }};julia=${{ matrix.version }};run_id=${{ github.run_id }};run_attempt=${{ github.run_attempt }}
          restore-keys: |
            julia-depot;workflow=Downgrade;os=${{ runner.os }};arch=${{ runner.arch }};julia=${{ matrix.version }};
      - name: Update cached registries
        if: steps.julia-cache.outputs.cache-matched-key != ''
        run: julia --color=yes -e 'import Pkg; Pkg.Registry.update()'
      - uses: julia-actions/julia-downgrade-compat@v2
        with:
          skip: LinearAlgebra,Printf,SparseArrays,UUIDs,DelimitedFiles,Test,Downloads,Random
          projects: ., test
          mode: forcedeps
      # We run the tests manually instead of using julia-action/julia-builpkg and julia-action/julia-runtest or `Pkg.test`
      # because otherwise the downgraded Manifest.toml is not used in the tests under julia <v1.12
      # see also https://github.com/julia-actions/julia-downgrade-compat/blob/00f940b7be2b50389571ed016d603be561649103/README.md#L89
      - name: Run tests
        run: |
          julia --project=test --color=yes -e '
            import Pkg
            Pkg.develop(Pkg.PackageSpec(path=pwd()))
            Pkg.instantiate()
            Pkg.status(; mode = Pkg.PKGMODE_MANIFEST)
            include("test/runtests.jl")
          '
        env:
          TRIXI_TEST: ${{ matrix.trixi_test }}
          # Print every `@testitem` (with its run time) in the test summary.
          TRIXI_TEST_VERBOSE: "true"
      # Do not save cache files when the job failed. We have observed several
      # failing CI jobs likely due to corrupted caches. In this case, we must
      # not save the corrupted files to the cache, which would lead to the same
      # issues again in the next run.
      - name: Save Julia depot cache
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.JULIA_DEPOT_CACHE_PATHS }}
          key: ${{ steps.julia-cache.outputs.cache-primary-key }}
