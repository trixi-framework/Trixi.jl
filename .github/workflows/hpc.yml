name: HPC
run-name: >-
  ${{ inputs.context_run_id && format('HPC resume {0}', inputs.context_run_id)
  || inputs.pull_request && format('HPC PR {0} {1} checks={2} julia={3}', inputs.pull_request, inputs.source_sha, inputs.checks, inputs.julia)
  || format('HPC checks={0} julia={1}', inputs.checks || 'all', inputs.julia || 'all') }}

on:
  workflow_dispatch:
    inputs:
      checks:
        description: Checks to run, all or cpu, mpi and gpu joined by +.
        type: string
        default: all
      julia:
        description: Julia versions to run, all or 1.10 and 1.13 joined by +.
        type: string
        default: all
      pull_request:
        description: Leave empty, or a PR number to run a reviewed commit of that PR.
        type: string
        default: ''
      source_sha:
        description: Leave empty, or the full hash of the reviewed PR commit.
        type: string
        default: ''
      context_run_id:
        description: Leave empty, set by continuation or for a manual resume.
        type: string
        default: ''
      command_comment:
        description: Leave empty, set by the PR command.
        type: string
        default: ''

permissions:
  contents: write
  checks: write
  actions: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  hpc:
    uses: pc2/hpc-cb-workflow/.github/workflows/hpc-pipeline.yml@58f6bf270de20d78d395877306e627c25f0c53d5
    with:
      gitlab_hostname: git.uni-paderborn.de
      gitlab_project_id: ${{ vars.GITLAB_PROJECT_ID }}
      pipeline_variables: |
        HPC_CHECKS=${{ inputs.checks || 'all' }}
        HPC_JULIA=${{ inputs.julia || 'all' }}
      variable_patterns: |
        HPC_CHECKS=(all|cpu|mpi|gpu)(\+(all|cpu|mpi|gpu))*
        HPC_JULIA=(all|1\.10|1\.13)(\+(all|1\.10|1\.13))*
    secrets:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
