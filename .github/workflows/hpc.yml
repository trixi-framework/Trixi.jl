name: HPC
run-name: ${{ inputs.context_run_id && format('HPC resume {0}', inputs.context_run_id) || format('HPC {0} {1} checks={2} julia={3}', inputs.pull_request, inputs.source_sha, inputs.checks, inputs.julia) }}

on:
  workflow_dispatch:
    inputs:
      context_run_id:
        description: The original GitHub run, leave empty to start jobs.
        type: string
        default: ''
      pull_request:
        description: An optional open PR containing the selected commit.
        type: string
        default: ''
      source_sha:
        description: The reviewed PR commit, used with pull_request.
        type: string
        default: ''
      command_comment:
        description: The PR comment that authorized the run, set by the HPC command.
        type: string
        default: ''
      checks:
        description: Checks to run, all or cpu, mpi and gpu joined by +.
        type: string
        default: all
      julia:
        description: Julia versions to run, all or 1.10 and 1.13 joined by +.
        type: string
        default: all

permissions:
  contents: write
  checks: write
  actions: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  hpc:
    uses: pc2/hpc-cb-workflow/.github/workflows/hpc-pipeline.yml@6fd64e50ceca2e0264d28af0ae4b28606266d44f
    with:
      gitlab_hostname: git.uni-paderborn.de
      gitlab_project_id: ${{ vars.GITLAB_PROJECT_ID }}
      pipeline_variables: |
        HPC_CHECKS=${{ inputs.checks || 'all' }}
        HPC_JULIA=${{ inputs.julia || 'all' }}
      variable_patterns: |
        HPC_CHECKS=(all|cpu|mpi|gpu)(\+(all|cpu|mpi|gpu))*
        HPC_JULIA=(all|1\.10|1\.13)(\+(all|1\.10|1\.13))*
    secrets:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
