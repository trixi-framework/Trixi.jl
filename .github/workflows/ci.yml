name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'AUTHORS.md'
      - 'CITATION.bib'
      - 'CONTRIBUTING.md'
      - 'LICENSE.md'
      - 'NEWS.md'
      - 'README.md'
      - '.zenodo.json'
      - '.github/workflows/benchmark.yml'
      - '.github/workflows/CompatHelper.yml'
      - '.github/workflows/TagBot.yml'
      - 'benchmark/**'
      - 'docs/**'
      - 'utils/**'
  pull_request:
    paths-ignore:
      - 'AUTHORS.md'
      - 'CITATION.bib'
      - 'CONTRIBUTING.md'
      - 'LICENSE.md'
      - 'NEWS.md'
      - 'README.md'
      - '.zenodo.json'
      - '.github/workflows/benchmark.yml'
      - '.github/workflows/CompatHelper.yml'
      - '.github/workflows/TagBot.yml'
      - 'benchmark/**'
      - 'docs/**'
      - 'utils/**'
  workflow_dispatch:

permissions:
  contents: read

# Cancel redundant CI tests automatically
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    # We could also include the Julia version as in
    # name: ${{ matrix.trixi_test }} - ${{ matrix.os }} - Julia ${{ matrix.version }} - ${{ matrix.arch }}
    # to be more specific. However, that requires us updating the required CI tests whenever we update Julia.
    name: ${{ matrix.trixi_test }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    env:
      # Parts of the Julia depot to cache, excluding lock files. Restoring and saving
      # must use the same list since it is part of the cache version.
      JULIA_DEPOT_CACHE_PATHS: |
        ~/.julia/artifacts
        ~/.julia/packages
        ~/.julia/registries
        ~/.julia/compiled
        ~/.julia/scratchspaces
        ~/.julia/logs
        !~/.julia/artifacts/*.pid
        !~/.julia/artifacts/*.pidfile
        !~/.julia/compiled/v*.*/*.pid
        !~/.julia/compiled/v*.*/*.pidfile
        !~/.julia/compiled/v*.*/*/*.pid
        !~/.julia/compiled/v*.*/*/*.pidfile
        !~/.julia/packages/*/*.pid
        !~/.julia/packages/*/*.pidfile
        !~/.julia/registries/*/.pid
        !~/.julia/registries/*/.pidfile
        !~/.julia/logs/*.pid
        !~/.julia/logs/*.pidfile
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          # - '~1.10.0-0' # including development versions
          # - 'nightly'
        os:
          - ubuntu-latest
        arch:
          - x64
        trixi_test:
          - tree_part1
          - tree_part2
          - tree_part3
          - tree_part4
          - tree_part5
          - structured
          - p4est_part1
          - p4est_part2
          - t8code_part1
          - unstructured_dgmulti
          - parabolic_part1
          - parabolic_part2
          - parabolic_part3
          - paper_self_gravitating_gas_dynamics
          - misc_part1
          - misc_part2
          - performance_specializations
          - mpi
          - threaded
          - kernelabstractions
          - kernelabstractions_mpi
        include:
          - version: '1.11'
            os: ubuntu-latest
            arch: x64
            trixi_test: threaded_legacy
          - version: '1.12'
            os: ubuntu-latest
            arch: x64
            trixi_test: threaded_legacy
          - version: '1.10'
            os: macos-latest
            arch: aarch64
            trixi_test: mpi
          - version: '1.10'
            os: macos-latest
            arch: aarch64
            trixi_test: threaded
          - version: '1.10'
            os: windows-latest
            arch: x64
            trixi_test: mpi
          - version: '1.10'
            os: windows-latest
            arch: x64
            trixi_test: threaded
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - run: julia -e 'using InteractiveUtils; versioninfo(verbose=true)'
      # Caches of the Julia depot are saved only from runs on `main` (see the save step
      # below). Pull requests restore them but do not save their own, since entries saved
      # from pull requests fill the repository cache storage and get the entries of `main`
      # evicted. The workflow `CacheCleanup.yml` deletes all but the newest entry per key
      # prefix.
      # All jobs with the same OS, architecture, and Julia version share one entry, since
      # they precompile the same test environment; the Julia version is part of the key
      # because precompiled files of one Julia version are useless for another.
      - name: Restore Julia depot cache
        id: julia-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.JULIA_DEPOT_CACHE_PATHS }}
          key: julia-depot;workflow=CI;os=${{ runner.os }};arch=${{ runner.arch }};julia=${{ matrix.version }};run_id=${{ github.run_id }};run_attempt=${{ github.run_attempt }}
          restore-keys: |
            julia-depot;workflow=CI;os=${{ runner.os }};arch=${{ runner.arch }};julia=${{ matrix.version }};
      - name: Update cached registries
        if: steps.julia-cache.outputs.cache-matched-key != ''
        run: julia --color=yes -e 'import Pkg; Pkg.Registry.update()'
      - uses: julia-actions/julia-buildpkg@v1
        env:
          PYTHON: ''
      - name: Run tests
        uses: julia-actions/julia-runtest@v1
        with:
          coverage: true
        env:
          PYTHON: ''
          TRIXI_TEST: ${{ matrix.trixi_test }}
          # Print every `@testitem` (with its run time) in the test summary, so per-testitem
          # timings show up in the job logs.
          TRIXI_TEST_VERBOSE: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # for authenticated downloads without strict rate limits
      - uses: julia-actions/julia-processcoverage@v1
        if: ${{ !cancelled() }}
        with:
          directories: src,examples,ext
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          files: ./lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
      # The standard setup of Coveralls is just annoying for parallel builds, see, e.g.,
      # https://github.com/trixi-framework/Trixi.jl/issues/691
      # https://github.com/coverallsapp/github-action/issues/47
      # https://github.com/coverallsapp/github-action/issues/67
      # This standard setup is reproduced below for completeness.
      # - uses: coverallsapp/github-action@master
      #   with:
      #     github-token: ${{ secrets.GITHUB_TOKEN }}
      #     flag-name: run-${{ matrix.trixi_test }}-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.arch }}-${{ github.run_id }}
      #     parallel: true
      #     file: ./lcov.info
      #     format: lcov
      # Instead, we use a more tedious approach:
      # - Store all individual coverage files as artifacts (directly below)
      # - Download and merge individual coverage reports in another step
      # - Upload only the merged coverage report to Coveralls
      - shell: bash
        if: ${{ !cancelled() }}
        run: |
          cp ./lcov.info ./lcov-${{ matrix.trixi_test }}-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.arch }}.info
      - uses: actions/upload-artifact@v7
        with:
          name: lcov-${{ matrix.trixi_test }}-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.arch }}
          path: ./lcov-${{ matrix.trixi_test }}-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.arch }}.info
      # Exactly one job per cache key saves the depot: the `threaded` or `threaded_legacy`
      # job. Their worker processes run without code coverage, so these jobs precompile
      # the test environment both with and without coverage, i.e., for all jobs with the
      # same key.
      - name: Save Julia depot cache
        if: >-
          ${{ !cancelled() && steps.julia-cache.outcome == 'success' &&
          github.ref == 'refs/heads/main' &&
          (matrix.trixi_test == 'threaded' || matrix.trixi_test == 'threaded_legacy') }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.JULIA_DEPOT_CACHE_PATHS }}
          key: ${{ steps.julia-cache.outputs.cache-primary-key }}

  finish:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # The standard setup of Coveralls is just annoying for parallel builds, see, e.g.,
      # https://github.com/trixi-framework/Trixi.jl/issues/691
      # https://github.com/coverallsapp/github-action/issues/47
      # https://github.com/coverallsapp/github-action/issues/67
      # This standard setup is reproduced below for completeness.
      # - name: Coveralls Finished
      #   uses: coverallsapp/github-action@master
      #   with:
      #     github-token: ${{ secrets.GITHUB_TOKEN }}
      #     parallel-finished: true
      # Instead, we use the more tedious approach described above.
      # At first, we check out the repository and download all artifacts
      # (and list files for debugging).
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
      - run: ls -R
      # Next, we merge the individual coverage files and upload
      # the combined results to Coveralls.
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Merge lcov files using Coverage.jl
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(temp=true)
          Pkg.add("Coverage")
          using Coverage
          coverage = LCOV.readfolder(".")
          for cov in coverage
            cov.filename = replace(cov.filename, "\\" => "/")
          end
          coverage = merge_coverage_counts(coverage)
          @show covered_lines, total_lines = get_summary(coverage)
          LCOV.writefile("./lcov.info", coverage)
      - uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./lcov.info
          format: lcov
          debug: true
      # Upload merged coverage data as artifact for debugging
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: ./lcov.info
      # That's it
      - run: echo "Finished testing Trixi"
